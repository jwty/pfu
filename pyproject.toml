[project]
name = "pfu"
version = "1.0.1"
description = "Python file uploader using Flask"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bootstrap-flask>=2.5.0",
    "colorlog>=6.10.1",
    "flask>=3.1.3",
    "flask-apscheduler>=1.13.1",
    "flask-login>=0.6.3",
    "humanize>=4.15.0",
    "peewee>=4.0.4",
    "types-peewee>=4.0.0.20260408",
    "waitress>=3.0.2",
    "werkzeug>=3.1.8",
]

[[tool.mypy.overrides]]
module = [
    "flask_login",
    "flask_login.*",
    "flask_apscheduler",
    "flask_apscheduler.*",
    "flask_bootstrap",
    "flask_bootstrap.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
