{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}
<h4 class="mb-3">Upload new file</h4>
<form action="/upload" method="post" enctype="multipart/form-data">
    <div class="d-grid row-gap-3 mb-3">
        <div class="row">
            <div class="col-md-6">
                <input class="form-control form-control-lg mb-3" type="file" id="file_up" name="file_up" required>
                <div class="display-inline form-check">
                    <input class="form-check-input" type="checkbox" id="keep" name="keep">
                    <label class="form-check-label">Keep original filename?</label>
                </div>
            </div>
        </div>
        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <label for="expire-date" class="form-label">Expiration date</label>
                <input type="date" class="form-control" id="expire-date" name="expire-date">
            </div>
            <div class="col-md-2">
                <label for="expire-date" class="form-label">Expiration time</label>
                <input type="time" class="form-control" id="expire-time" name="expire-time">
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-outline-primary w-100" id="clear-expire">Clear expiration date</button>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" rows="5" id="description" name="description"></textarea>
            </div>
        </div>
    </div>
    <button class="btn btn-primary btn-lg" type="submit"><i class="bi bi-upload me-2"></i>Upload</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='clear-expire-date.js') }}"></script>
{% endblock %}
