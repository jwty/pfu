{% extends "base.html" %}
{% block title %}{{ status|capitalize }}{% endblock %}
{% block content %}
<!-- TODO: Replace with flash messages maybe -->
<p>Operation completed with following status: <p class="font-monospace">{{ status }}</p></p>
<p>And returned following data:</p>
<ul class="align">
{% for key, value in data.items() %}
<li><b>{{ key }}</b> <span class="break">{{ value|urlize }}</span></li>
{% endfor %}
</ul>
{% endblock %}
