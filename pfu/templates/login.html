{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h4>Login</h4>
<form action="{{ url_for('auth.login_post', next=request.args.get('next')) }}" method="post">
    <div class="col-sm-3 d-grid gap-2 mb-3">
        <input type="text" name="username" class="form-control" id="username" placeholder="Username" required autofocus>
        <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="remember_user" id="remember_user">
        <label class="form-check-label" for="remember_user">Remember me</label>
    </div>
    <button class="btn btn-primary" type="submit">Login</button>
</form>
{% endblock %}
